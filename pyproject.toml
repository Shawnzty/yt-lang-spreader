[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "yt-lang-spreader"
version = "0.2.0"
description = "YouTube video summarizer, translator, and narrator with video generation"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.1.0",
    "openai>=1.0.0",
    "gtts>=2.5.0",
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
stock = ["yfinance>=0.2.0", "numpy>=1.24.0"]
elevenlabs = ["requests>=2.28.0"]
gui = ["gradio>=4.0.0"]
all = [
    "yfinance>=0.2.0",
    "numpy>=1.24.0",
    "gradio>=4.0.0",
]

[project.scripts]
yt-lang-spreader = "yt_lang_spreader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
